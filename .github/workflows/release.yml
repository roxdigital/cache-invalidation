name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check PHP syntax
        run: find src config -name '*.php' -print0 | xargs -0 -n1 php -l

  docs:
    name: Update docs
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md and README badge
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { tag_name, body, published_at } = context.payload.release;
            const version = tag_name.replace(/^v/, '');
            const date = published_at.substring(0, 10);
            const notes = (body ?? '').trim() || '_No release notes provided._';

            // ── CHANGELOG ────────────────────────────────────────────────────
            const clPath = 'CHANGELOG.md';
            const fallback = '# Changelog\n\nAll notable changes to this project will be documented in this file.\n';
            const current = fs.existsSync(clPath) ? fs.readFileSync(clPath, 'utf8') : fallback;

            if (current.includes(`## [${version}]`)) {
              core.info(`CHANGELOG already contains [${version}] — skipping`);
            } else {
              const entry = `## [${version}] - ${date}\n\n${notes}\n`;
              const idx = current.indexOf('\n## ');
              const updated = idx === -1
                ? current.trimEnd() + '\n\n' + entry
                : current.slice(0, idx + 1) + entry + '\n' + current.slice(idx + 1);
              fs.writeFileSync(clPath, updated);
              core.info(`CHANGELOG updated for ${version}`);
            }

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet && echo "Nothing to commit." && exit 0
          git commit -m "docs: release ${{ github.event.release.tag_name }}"
          git push origin main
